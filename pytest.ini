[pytest]
testpaths = test_agents.py
norecursedirs = remotion node_modules .agents workspace_*
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -ra
markers =
    unit: Unit tests for individual components and models
    integration: Integration tests between agents, schemas, and pipeline
    e2e: End-to-end tests for full pipeline execution
    tier1: Tier 1 primary feature tests (coverage)
    tier2: Tier 2 boundary and edge-case tests
    tier3: Tier 3 combinatorial and interaction matrix tests
    tier4: Tier 4 realistic full-workload scenario tests
    tier5: Tier 5 adversarial and stress tests
